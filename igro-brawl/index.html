<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#142b49"><title>IGRO Brawl</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,Arial,sans-serif;color:#fff;background:#163e70;touch-action:manipulation}button{font:inherit;border:0;color:white;font-weight:1000;cursor:pointer;text-shadow:0 2px 2px #0005}.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:block}
#lobby{background:radial-gradient(ellipse at 52% 43%,#65c8e9 0,#248bb9 38%,#16528b 78%,#103765 100%)}
.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:5px 12px;background:linear-gradient(#173b68dd,#12345b88);position:absolute;z-index:5;top:0;left:0;right:0}.brand{font-size:clamp(17px,3vw,27px);font-weight:1000;font-style:italic;letter-spacing:-1px;color:#ffe45b;text-shadow:0 3px #9a4a24,0 5px #512d28}.resources{display:flex;gap:7px}.res{background:#14335ce8;border:2px solid #6da9d3;border-radius:9px;padding:4px 9px;font-size:clamp(11px,1.8vw,16px);box-shadow:0 3px #0a2444}
.profile{position:absolute;top:64px;left:12px;z-index:4;background:#174b79dc;border:2px solid #8ad8f4;border-radius:12px;padding:7px 12px;font-weight:900;font-size:12px}.profile b{color:#ffe45b}
.hero{position:absolute;inset:54px 0 92px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 65%,#9be6f0aa,transparent 40%)}.hero:before{content:"";position:absolute;width:clamp(190px,38vw,370px);height:clamp(190px,38vw,370px);border-radius:50%;background:linear-gradient(140deg,#72d6e4,#2089b7);border:8px solid #b6f4fa66;box-shadow:0 15px 0 #104d7c55,0 0 70px #b9f7ff66}
.brawler{position:relative;width:clamp(140px,27vw,250px);height:clamp(170px,34vw,290px);filter:drop-shadow(0 12px 5px #07345466);z-index:1}.body{position:absolute;left:17%;top:27%;width:66%;height:65%;border-radius:42% 42% 35% 35%;background:linear-gradient(120deg,#ffdb58,#f58a28 68%,#c64b24);border:7px solid #813c2a;box-shadow:inset -13px -12px #a63f2c55}.head{position:absolute;left:12%;top:0;width:76%;height:58%;border-radius:48% 48% 43% 43%;background:linear-gradient(140deg,#ffdf83,#f7a33c);border:7px solid #843f2b;z-index:2}.hair{position:absolute;left:7%;top:-7%;width:85%;height:34%;border-radius:60% 50% 20% 20%;background:#713c2b;z-index:3}.eye{position:absolute;top:43%;width:13%;height:17%;border-radius:50%;background:white;border:3px solid #593326;z-index:4}.eye:after{content:"";position:absolute;width:45%;height:60%;background:#292b35;border-radius:50%;left:42%;top:20%}.eye.l{left:28%}.eye.r{right:28%}.mouth{position:absolute;left:40%;top:69%;width:22%;height:10%;border-bottom:5px solid #8b382a;border-radius:50%;z-index:4}.scarf{position:absolute;z-index:5;left:14%;top:52%;width:72%;height:19%;background:#39b7e9;border:5px solid #16527d;border-radius:30% 30% 45% 45%;transform:rotate(-8deg)}
.heroName{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);z-index:2;background:#123d68dd;border:3px solid #83d7f4;border-radius:12px;padding:5px 20px;font-weight:1000;font-size:clamp(15px,2.8vw,23px);white-space:nowrap;text-shadow:0 2px #000}.power{position:absolute;bottom:49px;left:50%;transform:translateX(-50%);z-index:3;font-size:11px;font-weight:900;color:#fff;text-shadow:0 2px #143451}
.event{position:absolute;right:12px;top:72px;width:clamp(112px,21vw,205px);background:linear-gradient(145deg,#ffdf55,#f59c2e);border:4px solid #fff0a0;border-radius:14px;color:#713c17;padding:8px;text-align:center;box-shadow:0 5px #9b531d;z-index:3}.event small{display:block;font-size:10px;font-weight:1000}.event strong{font-size:clamp(13px,2.2vw,20px);display:block}.event .map{font-size:clamp(10px,1.5vw,14px);margin-top:4px}
.bottom{position:absolute;bottom:0;left:0;right:0;height:88px;background:linear-gradient(#174b7adf,#0e315beF);border-top:3px solid #70c8e8;display:flex;align-items:center;justify-content:space-around;padding:5px 8px;z-index:5}.nav{background:linear-gradient(#3688bd,#175184);border:3px solid #8bd9f4;border-radius:12px;min-width:62px;padding:6px 8px;box-shadow:0 4px #0a2c50;font-size:clamp(9px,1.7vw,13px)}.nav span{display:block;font-size:clamp(18px,3vw,26px);line-height:1.1}.play{position:absolute;bottom:101px;left:50%;transform:translateX(-50%);z-index:4;min-width:clamp(150px,28vw,245px);padding:9px 26px;border-radius:15px;background:linear-gradient(#b8f34e,#63bd27);border:4px solid #e7ff9d;box-shadow:0 6px #327b21;font-size:clamp(17px,3vw,25px);color:#fff;text-shadow:0 3px #34711b}
#battle{background:#2b985e}#arena{width:100%;height:100%;display:block}.battleHud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;font-weight:1000;text-shadow:0 2px #000}.pill{background:#123c69dd;border:2px solid #a7e8ff;border-radius:10px;padding:6px 10px}.battleControls{position:absolute;bottom:12px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}.stick{width:100px;height:100px;border-radius:50%;background:#ffffff35;border:3px solid #ffffff88;position:relative;touch-action:none}.nub{position:absolute;width:42px;height:42px;left:26px;top:26px;background:#ffffffbb;border-radius:50%}.attack{width:76px;height:76px;border-radius:50%;background:linear-gradient(#ffdc57,#f27c21);border:5px solid #fff1a3;box-shadow:0 5px #a94c18;color:#74330c}.super{width:55px;height:55px;border-radius:50%;background:linear-gradient(#a8e9ff,#2384d5);border:4px solid #e4fbff;margin-right:10px}
.modalShade{position:absolute;inset:0;background:#06172bcc;z-index:10;display:none;place-items:center;padding:16px}.modal{width:min(440px,94vw);background:linear-gradient(#3286b8,#16416d);border:4px solid #a7e9ff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 8px #0b2b4c}.modal h2{margin:0 0 12px;color:#ffe45b;text-shadow:0 3px #80411e}.choice{display:block;width:100%;padding:10px;margin:7px 0;border-radius:10px;background:linear-gradient(#62b8e8,#216394);border:2px solid #a8e9ff}.close{background:#e95d55;border:2px solid #ffb0a8;border-radius:9px;padding:7px 18px;margin-top:8px}
@media(orientation:portrait){.hero{inset:55px 0 90px}.profile{top:61px}.event{top:112px}.heroName{bottom:0}.power{bottom:42px}}

/* Landscape-first game layout: rotate the whole game surface on portrait phones. */
@media(orientation:portrait){
  .screen{width:100vh;height:100vw;right:auto;bottom:auto;transform-origin:top left;transform:rotate(90deg) translateY(-100%);}
  #panel{width:100vh;height:100vw;inset:auto;top:0;left:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%);}
  .hero{inset:54px 0 92px}
  .profile{top:64px;left:12px}
  .event{top:72px;right:12px}
  .bottom{height:76px}
  .play{bottom:88px}
}
@media(orientation:landscape){
  .hero{inset:54px 0 78px}
  .bottom{height:74px}
  .play{bottom:86px}
  .event{top:68px}
}
</style></head><body>
<section id="lobby" class="screen active"><div class="top"><div class="brand">IGRO BRAWL</div><div class="resources"><div class="res">🪙 <b id="coins">1250</b></div><div class="res">💎 35 ＋</div><div class="res">🎟️ 8</div></div></div>
<div class="profile" onclick="openPanel('ПРОФИЛЬ')">👤 ИГРОК <b>#IGRO01</b><br>🏆 <span id="trophies">1280</span> кубков</div>
<div class="event" onclick="openPanel('СОБЫТИЕ')"><small>НОВОЕ СОБЫТИЕ</small><strong>СТОЛКНОВЕНИЕ</strong><div class="map">🌵 Дикая пустыня<br>Награда: 🏆 +8</div></div>
<div class="hero"><div class="brawler"><div class="body"></div><div class="head"></div><div class="hair"></div><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i><div class="scarf"></div></div><div class="heroName" id="heroName">БРУНО · БОЕЦ</div><div class="power">⭐ СИЛА 5　 ⚡ ГАДЖЕТ ГОТОВ</div></div>
<button class="play" onclick="startBattle()">▶ ИГРАТЬ</button>
<div class="bottom"><button class="nav" onclick="openPanel('БОЙЦЫ')"><span>🥊</span>БОЙЦЫ</button><button class="nav" onclick="openPanel('МАГАЗИН')"><span>🛒</span>МАГАЗИН</button><button class="nav" onclick="openPanel('БРАВЛ ПАСС')"><span>🎫</span>ПАСС</button><button class="nav" onclick="openPanel('КЛУБ')"><span>🛡️</span>КЛУБ</button><button class="nav" onclick="openPanel('ДРУЗЬЯ')"><span>👥</span>ДРУЗЬЯ</button></div>
</section>
<section id="battle" class="screen"><canvas id="arena"></canvas><div class="battleHud"><div class="pill">💚 <span id="hpText">100</span></div><div class="pill">⭐ <span id="battleScore">0</span></div><button class="pill" style="pointer-events:auto" onclick="backLobby()">✕ ВЫЙТИ</button></div><div class="battleControls"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div><button class="super" onclick="useSuper()">⚡</button><button class="attack" id="attack">АТАКА</button></div></div></section>
<div id="panel" class="modalShade" onclick="if(event.target===this)closePanel()"><div class="modal"><h2 id="panelTitle">МЕНЮ</h2><div id="panelBody"></div><button class="close" onclick="closePanel()">ЗАКРЫТЬ</button></div></div>
<script>
const $=id=>document.getElementById(id);let arena=$('arena'),ctx=arena.getContext('2d'),running=false,player,bots=[],shots=[],enemyShots=[],score=0,hp=100,stick={x:0,y:0},last=0,cd=0,superReady=true,world={w:1200,h:760};
function openPanel(name){$('panelTitle').textContent=name;let data={БОЙЦЫ:'🥊 БРУНО — СИЛА 5<br>🔒 Луна — скоро<br>🔒 Рокки — скоро',МАГАЗИН:'🪙 Ежедневная награда<br>🎁 Ящик бойца — скоро<br>💎 Особые предложения', 'БРАВЛ ПАСС':'🎫 Сезон IGRO: Путь героев<br>Награды открываются за победы.',КЛУБ:'🛡️ Создай клуб или найди друзей.',ДРУЗЬЯ:'👥 Список друзей пока пуст.',ПРОФИЛЬ:'ИГРОК #IGRO01<br>🏆 1280 кубков<br>🥇 Лучший результат: '+score,СОБЫТИЕ:'🌵 СТОЛКНОВЕНИЕ<br>Карта: Дикая пустыня<br>Собирай усилители и побеждай!'};$('panelBody').innerHTML=(data[name]||'Скоро в игре')+'<button class="choice" onclick="startBattle();closePanel()">▶ НАЧАТЬ БОЙ</button>';$('panel').style.display='grid'}function closePanel(){$('panel').style.display='none'}
function gameWidth(){return innerWidth>innerHeight?innerWidth:innerHeight}function gameHeight(){return innerWidth>innerHeight?innerHeight:innerWidth}function resize(){let d=Math.min(devicePixelRatio||1,2),w=gameWidth(),h=gameHeight();arena.width=w*d;arena.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function spawn(){player={x:600,y:380,r:24};hp=100;score=0;shots=[];enemyShots=[];bots=[];for(let i=0;i<5;i++){let a=i*Math.PI*2/5;bots.push({x:600+Math.cos(a)*390,y:380+Math.sin(a)*270,r:23,hp:100,cd:Math.random()})} $('hpText').textContent=hp;$('battleScore').textContent=score}
function startBattle(){closePanel();$('lobby').classList.remove('active');$('battle').classList.add('active');resize();spawn();running=true;last=0;try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}requestAnimationFrame(loop)}
function backLobby(){running=false;$('battle').classList.remove('active');$('lobby').classList.add('active')}
function fire(){if(!running||cd>0)return;cd=.28;let t=bots.sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];if(!t)return;let a=Math.atan2(t.y-player.y,t.x-player.x);shots.push({x:player.x,y:player.y,vx:Math.cos(a)*680,vy:Math.sin(a)*680,life:1.2});}
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();fire()});
function useSuper(){if(!running||!superReady)return;superReady=false;for(let b of bots){if(Math.hypot(b.x-player.x,b.y-player.y)<330)b.hp-=70}bots=bots.filter(b=>b.hp>0);setTimeout(()=>superReady=true,5000)}
function loop(ts){if(!running)return;let dt=Math.min((ts-last)/1000||0,.04);last=ts;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){let dx=stick.x,dy=stick.y;player.x=Math.max(25,Math.min(world.w-25,player.x+dx*260*dt));player.y=Math.max(25,Math.min(world.h-25,player.y+dy*260*dt));cd-=dt;
for(let b of bots){let x=player.x-b.x,y=player.y-b.y,d=Math.hypot(x,y)||1;if(d>210){b.x+=x/d*70*dt;b.y+=y/d*70*dt}b.cd-=dt;if(d<440&&b.cd<0){enemyShots.push({x:b.x,y:b.y,vx:x/d*250,vy:y/d*250,life:2});b.cd=1.5+Math.random()}if(d<48){hp-=12*dt;$('hpText').textContent=Math.max(0,Math.round(hp))}}
enemyShots=enemyShots.filter(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(Math.hypot(s.x-player.x,s.y-player.y)<player.r+7){hp-=12;$('hpText').textContent=Math.max(0,Math.round(hp));return false}return s.life>0});shots=shots.filter(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(let b of bots)if(Math.hypot(s.x-b.x,s.y-b.y)<b.r+8){b.hp-=35;if(b.hp<=0){b.dead=true;score++;$('battleScore').textContent=score}return false}return s.life>0});bots=bots.filter(b=>!b.dead);if(hp<=0||bots.length===0){running=false;setTimeout(()=>{alert(hp>0?'ПОБЕДА!':'ПОРАЖЕНИЕ');backLobby()},50)}}
function draw(){let w=gameWidth(),h=gameHeight(),s=Math.min(w/900,h/560),vw=w/s,vh=h/s,cx=Math.max(vw/2,Math.min(world.w-vw/2,player.x)),cy=Math.max(vh/2,Math.min(world.h-vh/2,player.y));ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2,h/2);ctx.scale(s,s);ctx.translate(-cx,-cy);ctx.fillStyle='#31965b';ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle='#b6e994';ctx.lineWidth=18;ctx.strokeRect(8,8,world.w-16,world.h-16);
for(let i=0;i<180;i++){let x=(i*137)%world.w,y=(i*211)%world.h;ctx.fillStyle='#3ba968';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill()}
let walls=[[270,190,100,80],[820,180,110,90],[500,510,130,75],[130,480,100,90],[990,470,100,90]];for(let [x,y,a,b] of walls){ctx.fillStyle='#8d5738';ctx.fillRect(x,y,a,b);ctx.fillStyle='#c88b50';ctx.fillRect(x+8,y+8,a-16,b-16)}
for(let i=0;i<7;i++){let x=80+i*155,y=i%2?100:620;ctx.fillStyle='#176c43';ctx.beginPath();ctx.ellipse(x,y,65,38,0,0,7);ctx.fill()}
for(let b of bots)char(b,'#ef5961');for(let q of enemyShots){ctx.fillStyle='#ff8a91';ctx.beginPath();ctx.arc(q.x,q.y,7,0,7);ctx.fill()}for(let q of shots){ctx.fillStyle='#fff08a';ctx.beginPath();ctx.arc(q.x,q.y,8,0,7);ctx.fill()}char(player,'#38a9ed');ctx.restore()}
function char(o,c){ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(o.x,o.y+15,o.r,9,0,0,7);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x+6,o.y-5,5,0,7);ctx.fill();ctx.fillStyle='#263348';ctx.beginPath();ctx.arc(o.x+8,o.y-5,2,0,7);ctx.fill();if(o.hp<100){ctx.fillStyle='#522';ctx.fillRect(o.x-20,o.y-34,40,5);ctx.fillStyle='#5f5';ctx.fillRect(o.x-20,o.y-34,40*Math.max(0,o.hp/100),5)}}
let pointer=null;const stickEl=$('stick'),nub=$('nub');function stickMove(e){let r=stickEl.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),m=32;if(l>m){x=x/l*m;y=y/l*m}stick.x=x/m;stick.y=y/m;nub.style.left=(26+x)+'px';nub.style.top=(26+y)+'px'}stickEl.addEventListener('pointerdown',e=>{pointer=e.pointerId;stickEl.setPointerCapture(pointer);stickMove(e)});stickEl.addEventListener('pointermove',e=>{if(e.pointerId===pointer)stickMove(e)});function reset(){pointer=null;stick.x=stick.y=0;nub.style.left='26px';nub.style.top='26px'}stickEl.addEventListener('pointerup',reset);stickEl.addEventListener('pointercancel',reset);
</script></body></html>
