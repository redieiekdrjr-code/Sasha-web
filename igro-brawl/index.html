<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101a2b"><title>IGRO Brawl — Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2b;color:#fff;font-family:system-ui,Arial;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:#16283a}
.hud{position:fixed;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 3px #000}
.panel{background:#0b1422d9;border:1px solid #ffffff28;border-radius:14px;padding:9px 13px;font-weight:800}
#health{height:9px;width:150px;background:#3b2730;border-radius:10px;overflow:hidden;margin-top:6px}#hp{height:100%;width:100%;background:#54df80}
#hint{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:12px;color:#d6e4f2;background:#0b1422b8;padding:7px 12px;border-radius:20px;pointer-events:none;white-space:nowrap}
.controls{position:fixed;inset:auto 0 18px;display:flex;justify-content:space-between;align-items:end;padding:0 24px;pointer-events:none}
#stick{width:116px;height:116px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;position:relative;pointer-events:auto}
#nub{width:48px;height:48px;border-radius:50%;background:#dceeffbb;position:absolute;left:32px;top:32px;box-shadow:0 3px 10px #0008}
#attack{width:86px;height:86px;border-radius:50%;border:4px solid #ffffff80;background:linear-gradient(#ffca52,#e87921);color:#47220a;font-weight:1000;font-size:17px;box-shadow:0 5px 0 #9b4816;pointer-events:auto}
#attack:active{transform:scale(.94)}
#overlay{position:fixed;inset:0;background:#08111bdc;display:grid;place-items:center;padding:20px}
.modal{max-width:420px;width:100%;background:#182b40;border:1px solid #ffffff30;border-radius:22px;padding:24px;text-align:center;box-shadow:0 20px 70px #0009}
h1{margin:0 0 8px;font-size:32px;letter-spacing:1px}p{color:#c1d1e2;line-height:1.45}.primary{border:0;border-radius:14px;padding:14px 28px;background:#ffbd45;color:#38200a;font-weight:1000;font-size:17px}
#result{font-size:23px;font-weight:900;margin:10px}
@media(orientation:portrait){#hint:after{content:" · поверни телефон горизонтально"}}
</style></head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="panel">IGRO BRAWL<br><small id="status">Подготовка арены</small><div id="health"><div id="hp"></div></div></div><div class="panel">⭐ <span id="score">0</span><br><small>ПОБЕДЫ</small></div></div>
<div id="hint">Левый джойстик — движение · кнопка справа — атака</div>
<div class="controls"><div id="stick"><div id="nub"></div></div><button id="attack">АТАКА</button></div>
<div id="overlay"><div class="modal"><h1>IGRO BRAWL</h1><div style="color:#ffca58;font-weight:900">BRAWL ARENA • ТЕСТ 0.2</div><p>Динамичная арена с укрытиями, кустами, ящиками и камерой, которая следует за бойцом. Побеждай соперников и собирай звёзды!</p><div id="result"></div><button class="primary" id="start">НАЧАТЬ БОЙ</button></div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),hpbar=document.getElementById('hp'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status'),overlay=document.getElementById('overlay'),resultEl=document.getElementById('result');
let W=0,H=0,worldW=1600,worldH=1000,player,bots=[],shots=[],score=0,running=false,last=0,attackCd=0,stick={x:0,y:0},keys={};\nconst bushes=[{x:190,y:170,w:210,h:115},{x:620,y:170,w:180,h:120},{x:1120,y:160,w:260,h:130},{x:280,y:690,w:230,h:130},{x:850,y:720,w:220,h:120},{x:1250,y:680,w:180,h:140}];\nconst blocks=[{x:480,y:330,w:100,h:90},{x:1020,y:330,w:100,h:90},{x:730,y:570,w:140,h:70},{x:170,y:430,w:90,h:90},{x:1340,y:430,w:90,h:90}];\nconst crates=[{x:760,y:250},{x:840,y:250},{x:760,y:790},{x:840,y:790}];
function resize(){const d=Math.min(devicePixelRatio||1,2);W=canvas.width=Math.floor(innerWidth*d);H=canvas.height=Math.floor(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}
addEventListener('resize',resize);resize();
function spawn(){player={x:worldW/2,y:worldH/2,r:27,hp:100,max:100,speed:270,face:0,hit:0};bots=[];shots=[];for(let i=0;i<3;i++){let a=i*Math.PI*2/3;bots.push({x:worldW/2+Math.cos(a)*510,y:worldH/2+Math.sin(a)*330,r:25,hp:90,max:90,speed:105+Math.random()*20,cd:Math.random(),hit:0})}}
function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawChar(o,color,accent){ctx.save();ctx.translate(o.x,o.y);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,15,o.r*1.1,o.r*.55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=accent;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-5,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#182333';ctx.beginPath();ctx.arc(9,-5,2.5,0,Math.PI*2);ctx.fill();ctx.restore();if(o.hp<o.max){roundRect(o.x-23,o.y-o.r-13,46,6,4,'#3b2730');roundRect(o.x-23,o.y-o.r-13,46*Math.max(0,o.hp/o.max),6,4,'#57e181')}}
function draw(){ctx.clearRect(0,0,W,H);let scale=Math.min(W/900,H/540);let viewW=W/scale,viewH=H/scale;let cx=player?player.x:worldW/2,cy=player?player.y:worldH/2;let camX=Math.max(viewW/2,Math.min(worldW-viewW/2,cx)),camY=Math.max(viewH/2,Math.min(worldH-viewH/2,cy));ctx.save();ctx.translate(W/2,H/2);ctx.scale(scale,scale);ctx.translate(-camX,-camY);
ctx.fillStyle='#277e55';ctx.fillRect(0,0,worldW,worldH);
ctx.fillStyle='#319363';for(let i=0;i<180;i++){let x=(i*137+33)%worldW,y=(i*223+71)%worldH;ctx.beginPath();ctx.arc(x,y,3+(i%4),0,Math.PI*2);ctx.fill()}
ctx.strokeStyle='#a7ed9a';ctx.lineWidth=18;ctx.strokeRect(9,9,worldW-18,worldH-18);
blocks.forEach(b=>{roundRect(b.x+5,b.y+8,b.w,b.h,15,'#174b3b');roundRect(b.x,b.y,b.w,b.h,15,'#b56c3e');roundRect(b.x+9,b.y+9,b.w-18,b.h-18,10,'#d38b4d')});
crates.forEach(q=>{roundRect(q.x+4,q.y+7,54,54,9,'#174b3b');roundRect(q.x,q.y,54,54,9,'#d69a43');ctx.strokeStyle='#81502b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(q.x+8,q.y+8);ctx.lineTo(q.x+46,q.y+46);ctx.moveTo(q.x+46,q.y+8);ctx.lineTo(q.x+8,q.y+46);ctx.stroke()});
bushes.forEach(b=>{ctx.fillStyle='#1c7547';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,24);ctx.fill();ctx.fillStyle='#43b765';for(let i=0;i<18;i++){let x=b.x+(i*37)%b.w,y=b.y+(i*29)%b.h;ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill()}});
if(player){for(const s of shots){ctx.fillStyle='#fff1a0';ctx.beginPath();ctx.arc(s.x,s.y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f28b35';ctx.lineWidth=4;ctx.stroke()}bots.forEach(b=>drawChar(b,'#f45b62','#ffd0a8'));drawChar(player,'#39a9ff','#d5f2ff')}
ctx.restore()}function update(dt){if(!running)return;let ix=stick.x,iy=stick.y;if(keys.ArrowLeft||keys.a)ix-=1;if(keys.ArrowRight||keys.d)ix+=1;if(keys.ArrowUp||keys.w)iy-=1;if(keys.ArrowDown||keys.s)iy+=1;let m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}if(m>.05){player.x+=ix*player.speed*dt;player.y+=iy*player.speed*dt;player.face=Math.atan2(iy,ix)}player.x=Math.max(28,Math.min(worldW-28,player.x));player.y=Math.max(28,Math.min(worldH-28,player.y));attackCd-=dt;player.hit=Math.max(0,player.hit-dt);
bots.forEach((b,i)=>{b.hit=Math.max(0,b.hit-dt);let dx=player.x-b.x,dy=player.y-b.y,d=Math.hypot(dx,dy)||1;if(d>52){b.x+=dx/d*b.speed*dt;b.y+=dy/d*b.speed*dt}else{b.cd-=dt;if(b.cd<=0){player.hp-=9;b.cd=1.05;player.hit=.15}}});
shots=shots.filter(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(let b of bots){if(Math.hypot(s.x-b.x,s.y-b.y)<b.r+8){b.hp-=34;b.hit=.12;if(b.hp<=0){b.dead=true;score++;scoreEl.textContent=score}return false}}return s.life>0});bots=bots.filter(b=>!b.dead);
if(player.hp<=0){end(false);return}if(!bots.length){end(true);return}hpbar.style.width=Math.max(0,player.hp/player.max*100)+'%';statusEl.textContent='Бой идёт · ботов: '+bots.length}
function fire(){if(!running||attackCd>0)return;attackCd=.34;let target=null,best=1e9;for(let b of bots){let d=Math.hypot(b.x-player.x,b.y-player.y);if(d<best){best=d;target=b}}if(!target)return;let a=Math.atan2(target.y-player.y,target.x-player.x);shots.push({x:player.x+Math.cos(a)*25,y:player.y+Math.sin(a)*25,vx:Math.cos(a)*570,vy:Math.sin(a)*570,life:.85})}
function end(win){running=false;statusEl.textContent=win?'Арена очищена':'Боец выбыл';resultEl.textContent=win?'ПОБЕДА!':'ПОРАЖЕНИЕ';document.getElementById('start').textContent='ЕЩЁ РАЗ';overlay.style.display='grid'}
function loop(t){let dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('start').onclick=()=>{score=0;scoreEl.textContent='0';spawn();running=true;overlay.style.display='none';statusEl.textContent='Бой идёт · ботов: '+bots.length;hpbar.style.width='100%'};
const stickEl=document.getElementById('stick'),nub=document.getElementById('nub');let pointer=null;
function moveStick(e){let r=stickEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=39;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.x=dx/max;stick.y=dy/max;nub.style.left=(32+dx)+'px';nub.style.top=(32+dy)+'px'}
stickEl.addEventListener('pointerdown',e=>{pointer=e.pointerId;stickEl.setPointerCapture(pointer);moveStick(e)});stickEl.addEventListener('pointermove',e=>{if(e.pointerId===pointer)moveStick(e)});function release(){pointer=null;stick.x=stick.y=0;nub.style.left='32px';nub.style.top='32px'}stickEl.addEventListener('pointerup',release);stickEl.addEventListener('pointercancel',release);
document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();fire()});addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();fire()}});addEventListener('keyup',e=>keys[e.key]=false);
})();
</script></body></html>
