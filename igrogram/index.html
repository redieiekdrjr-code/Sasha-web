<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17212b"><title>IGROgram</title>
<style>
:root{--bg:#17212b;--panel:#202b36;--panel2:#242f3b;--muted:#8796a5;--blue:#3390ec;--line:#2b3947;--text:#f5f7f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Arial,sans-serif;height:100dvh;overflow:hidden}
button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{height:100dvh;display:flex;max-width:1180px;margin:auto;background:var(--bg);box-shadow:0 0 28px #0003}
.sidebar{width:360px;max-width:100%;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid #0e1720}
.top{height:60px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);flex-shrink:0}.iconbtn{width:40px;height:40px;border-radius:50%;background:transparent;color:#aebbc7;font-size:23px}.iconbtn:hover,.filter button:hover{background:#ffffff12}.brand{font-weight:750;font-size:20px;letter-spacing:.2px;flex:1}.brand span{color:var(--blue)}
.search{padding:4px 12px 12px;display:flex;gap:8px}.search input{height:42px;border:1px solid transparent;border-radius:10px;background:#17212b;color:var(--text);outline:none;padding:0 14px;width:100%}.search input:focus{border-color:var(--blue)}
.filter{display:flex;gap:4px;padding:0 12px 10px}.filter button{background:transparent;color:var(--muted);padding:8px 12px;border-radius:18px;font-size:13px}.filter button.active{background:#2b5278;color:#7fc1ff}
.chats{overflow:auto;flex:1}.chat{height:72px;display:flex;align-items:center;gap:12px;padding:9px 14px;cursor:pointer}.chat:hover{background:#ffffff0b}.chat.active{background:#2b5278}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:650;flex-shrink:0;background:#46779d}.chatmeta{min-width:0;flex:1}.chatname{font-weight:600;margin-bottom:4px}.preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:11px;color:var(--muted);align-self:flex-start;margin-top:7px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.welcome{margin:auto;text-align:center;color:var(--muted);padding:24px}.welcome .logo{font-size:52px;margin-bottom:12px}.welcome h2{color:var(--text);font-size:23px;margin:0 0 8px}.welcome p{margin:0;line-height:1.5}
.chathead{height:60px;background:var(--panel);display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}.chathead .avatar{width:42px;height:42px;font-size:18px}.chathead small{display:block;color:var(--muted);margin-top:2px}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(ellipse at center,#1d2b38 0%,#17212b 70%)}.bubble{max-width:min(75%,520px);align-self:flex-start;background:#253442;padding:9px 12px;border-radius:12px 12px 12px 3px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#2b5278;border-radius:12px 12px 3px 12px}.bubble small{display:block;color:#b6c6d4;text-align:right;font-size:10px;margin-top:4px}.composer{padding:12px 16px;display:flex;gap:10px;background:var(--panel)}.composer input{flex:1;min-width:0;border:0;outline:none;background:#17212b;color:var(--text);border-radius:22px;padding:12px 16px}.send{width:44px;height:44px;border-radius:50%;background:var(--blue);font-size:20px}
.overlay{position:fixed;inset:0;background:#0008;display:none;z-index:5}.overlay.show{display:block}.drawer{position:absolute;top:0;bottom:0;left:0;width:min(300px,85vw);background:var(--panel);box-shadow:8px 0 30px #0005;padding-bottom:20px}.drawerhero{height:145px;background:linear-gradient(135deg,#2676ad,#18476c);padding:24px;display:flex;flex-direction:column;justify-content:flex-end}.drawerhero .avatar{background:#ffffff2b;width:52px;height:52px;margin-bottom:8px}.draweritem{display:flex;align-items:center;gap:18px;padding:14px 22px;color:#e5edf4;background:transparent;width:100%;text-align:left}.draweritem:hover{background:#ffffff12}.draweritem span{width:24px;font-size:20px;text-align:center}.version{padding:18px 22px;color:var(--muted);font-size:12px}
@media(max-width:650px){.sidebar{width:100%;border:0}.main{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.top{height:56px}.chathead .back{display:block}.chathead{padding:0 10px}.messages{padding:12px}.bubble{max-width:88%}}
@media(min-width:651px){.chathead .back{display:none}}
</style></head>
<body>
<div class="app" id="app">
<aside class="sidebar">
<header class="top"><button class="iconbtn" id="menu" aria-label="Меню">☰</button><div class="brand">IGRO<span>gram</span></div><button class="iconbtn" id="searchToggle" aria-label="Поиск">⌕</button></header>
<div class="search"><input id="search" placeholder="Поиск" autocomplete="off"></div>
<div class="filter"><button class="active" data-filter="all">Все чаты</button><button data-filter="personal">Личные</button><button data-filter="groups">Группы</button></div>
<div class="chats" id="chats"></div>
</aside>
<main class="main" id="main"><section class="welcome" id="welcome"><div class="logo">✈️</div><h2>IGROgram</h2><p>Ваш мессенджер<br>Выберите чат, чтобы начать общение</p></section></main>
</div>
<div class="overlay" id="overlay"><nav class="drawer"><div class="drawerhero"><div class="avatar">И</div><b>IGROgram</b><small>Ваш мессенджер</small></div>
<button class="draweritem" data-action="profile"><span>👤</span>Мой профиль</button><button class="draweritem" data-action="contacts"><span>👥</span>Контакты</button><button class="draweritem" data-action="calls"><span>📞</span>Звонки</button><button class="draweritem" data-action="saved"><span>⭐</span>Избранное</button><button class="draweritem" data-action="settings"><span>⚙️</span>Настройки</button><div class="version">IGROgram · версия 1.2</div></nav></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
let chats=[],active=null,filter='all',socket=null,myId='web-'+Math.random().toString(36).slice(2,10);
const fallback=[{id:'saved',name:'Избранное',avatar:'★',color:'#6da9d3',type:'personal',description:'Сохранённые сообщения'},{id:'news',name:'IGROgram Новости',avatar:'И',color:'#4f9bce',type:'groups',description:'Объявления проекта'},{id:'alex',name:'Алексей',avatar:'А',color:'#d58b75',type:'personal',description:'Личный чат'},{id:'dev',name:'Разработка',avatar:'💻',color:'#8c83c7',type:'groups',description:'Обсуждение разработки'},{id:'maria',name:'Мария',avatar:'М',color:'#c77da5',type:'personal',description:'Личный чат'}];
async function loadChats(){try{const r=await fetch('/api/igrogram/chats');if(!r.ok)throw 0;chats=await r.json()}catch(e){chats=fallback}renderChats()}
function renderChats(){const q=$('#search').value.toLowerCase();$('#chats').innerHTML='';chats.filter(c=>(filter==='all'||c.type===filter)&&(c.name+' '+(c.description||'')).toLowerCase().includes(q)).forEach(c=>{const el=document.createElement('div');el.className='chat'+(active?.id===c.id?' active':'');el.innerHTML='<div class="avatar"></div><div class="chatmeta"><div class="chatname"></div><div class="preview"></div></div><div class="time"> </div>';el.querySelector('.avatar').textContent=c.avatar;el.querySelector('.avatar').style.background=c.color;el.querySelector('.chatname').textContent=c.name;el.querySelector('.preview').textContent=c.description||'Нет сообщений';el.onclick=()=>openChat(c);$('#chats').append(el)})}
function openChat(c){active=c;app.classList.add('chat-open');renderChats();$('#main').innerHTML='<header class="chathead"><button class="iconbtn back" id="back">‹</button><div class="avatar" style="background:'+c.color+'">'+c.avatar+'</div><div><b>'+escapeHtml(c.name)+'</b><small>был(а) недавно</small></div></header><div class="messages" id="messages"></div><form class="composer" id="composer"><input id="message" placeholder="Сообщение" autocomplete="off"><button class="send" type="submit">➤</button></form>';$('#back').onclick=()=>{app.classList.remove('chat-open');active=null;$('#main').innerHTML='<section class="welcome"><div class="logo">✈️</div><h2>IGROgram</h2><p>Ваш мессенджер<br>Выберите чат, чтобы начать общение</p></section>';renderChats()};$('#composer').onsubmit=e=>{e.preventDefault();sendMessage($('#message').value);$('#message').value=''};loadMessages(c.id);if(socket){socket.emit('igro:join',{chatId:c.id})}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addMessage(m){if(!$('#messages'))return;const el=document.createElement('div');el.className='bubble'+(m.senderId===myId?' mine':'');el.textContent=m.text;const time=document.createElement('small');time.textContent=new Date(m.createdAt||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});el.append(time);$('#messages').append(el);$('#messages').scrollTop=$('#messages').scrollHeight}
async function loadMessages(id){$('#messages').innerHTML='';try{const r=await fetch('/api/igrogram/messages/'+encodeURIComponent(id));if(r.ok){const data=await r.json();data.forEach(addMessage)}}catch(e){}}
function sendMessage(text){text=text.trim();if(!text||!active)return;const m={chatId:active.id,text,senderId:myId,senderName:'Пользователь',createdAt:new Date().toISOString()};if(socket&&socket.connected)socket.emit('igro:send',m);else addMessage(m)}
$('#menu').onclick=()=>$('#overlay').classList.add('show');$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('show')};$('#search').oninput=renderChats;$('#searchToggle').onclick=()=>$('#search').focus();document.querySelectorAll('.filter button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter button').forEach(x=>x.classList.toggle('active',x===b));renderChats()});document.querySelectorAll('.draweritem').forEach(b=>b.onclick=()=>{const a=b.dataset.action;$('#overlay').classList.remove('show');if(a==='saved'){const c=chats.find(x=>x.id==='saved');if(c)openChat(c)}else alert(({profile:'Профиль пользователя',contacts:'Контакты',calls:'Звонки',settings:'Настройки'})[a]+' — раздел в разработке')});
try{if(window.io){socket=io();socket.on('connect',()=>{if(active)socket.emit('igro:join',{chatId:active.id})});socket.on('igro:message',m=>{if(active&&m.chatId===active.id)addMessage(m)});socket.on('igro:history',d=>{if(active&&d.chatId===active.id){$('#messages').innerHTML='';d.messages.forEach(addMessage)}})}}catch(e){}
loadChats();
</script></body></html>
