name: Build IGRO Brawl APK

on:
  workflow_dispatch:
  push:
    paths:
      - "igro-brawl/**"
      - ".github/workflows/igro-brawl-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Capacitor
        working-directory: igro-brawl
        run: npm install

      - name: Generate Android project
        working-directory: igro-brawl
        run: npx cap add android

      - name: Sync game into Android app
        working-directory: igro-brawl
        run: npx cap sync android

      - name: Build debug APK
        working-directory: igro-brawl/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGRO-Brawl-APK
          path: igro-brawl/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
